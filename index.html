
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MealTube</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.circle-1,
.circle-2,
.circle-3 {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    animation: float 6s ease-in-out infinite;
}

.circle-1 {
    width: 500px;
    height: 500px;
    top: 5%;
    left: 10%;
    background: linear-gradient(to right, #8E54E9, #4776E6);
}

.circle-2 {
    width: 350px;
    height: 350px;
    bottom: 5%;
    right: 10%;
    background: linear-gradient(to right, #f80759, #bc4e9c);
}

.circle-3 {
    width: 150px;
    height: 150px;
    top: 20%;
    right: 30%;
    background: linear-gradient(to right, #ff5e62, #ff9966);
}

.card {
    position: relative;
    z-index: 2;
    width: 350px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

h1 {
    color: white;
    text-align: center;
    margin-bottom: 25px;
}

label {
    color: white;
    display: block;
    margin-bottom: 8px;
    margin-top: 15px;
}

select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 15px;
}

option {
    color: black;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(to right, #4776E6, #8E54E9);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 15px;
}

button:hover {
    transform: scale(1.03);
}

#results {
    margin-top: 25px;
    color: white;
}

.video-card {
    margin-bottom: 20px;
    background: rgba(255,255,255,0.08);
    padding: 10px;
    border-radius: 12px;
}

.video-title {
    margin-top: 10px;
    font-size: 14px;
}

@keyframes float {
    0% {
        transform: translateY(0px);
    }
    50% {
        transform: translateY(-15px);
    }
    100% {
        transform: translateY(0px);
    }
}
</style>
</head>

<body>

<div class="circle-1"></div>
<div class="circle-2"></div>
<div class="circle-3"></div>

<div class="card">

    <h1>MealTube 🍜</h1>

    <label for="duration">Select Video Duration</label>
    <select id="duration">
        <option value="short">5-15 mins</option>
        <option value="medium">15-20 mins</option>
        <option value="long">20 mins+</option>
    </select>

    <label for="genre">Select Genre</label>
    <select id="genre">
        <option value="gaming">Gaming</option>
        <option value="food">Food</option>
        <option value="video essay">Video Essay</option>
        <option value="commentary">Audio Commentary</option>
        <option value="podcast">Podcast</option>
    </select>

    <button onclick="searchVideos()">
        Find Meal Videos
    </button>

    <div id="results"></div>

</div>

<script>

// IMPORTANT:
// Replace this with your NEW restricted API key
const API_KEY = "AIzaSyDxPcXZ_RshyhcUc5pLEy8RIOnTPGbpnnQ";

async function searchVideos() {

    const duration = document.getElementById("duration").value;
    const genre = document.getElementById("genre").value;
    const results = document.getElementById("results");

    results.innerHTML = "<p>Loading videos...</p>";
    try {
        await fetch('save_preferences.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ genre: genre, duration: duration })
        });
    } catch (error) {
        console.error("Could not save to database:", error);
    }

    let videoDuration = "medium";

    if(duration === "short") {
        videoDuration = "short";
    }

    if(duration === "long") {
        videoDuration = "long";
    }

    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoDuration=${videoDuration}&maxResults=5&q=${genre}&key=${API_KEY}`;

    try {

        const response = await fetch(url);
        const data = await response.json();

        displayResults(data.items);

    } catch(error) {

        results.innerHTML = "<p>Something went wrong.</p>";
        console.error(error);
    }
}

function displayResults(videos) {

    const results = document.getElementById("results");

    results.innerHTML = "";

    if(!videos || videos.length === 0) {
        results.innerHTML = "<p>No videos found.</p>";
        return;
    }

    videos.forEach(video => {

        const videoId = video.id.videoId;
        const title = video.snippet.title;

        results.innerHTML += `
        <div class="video-card">

<iframe
    width="100%"
    height="200"
    src="https://www.youtube-nocookie.com/embed/${videoId}"
    title="${title}"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
</iframe>

<p class="video-title">${title}</p>

</div>
        `;
    });
}

</script>

</body>
</html>
